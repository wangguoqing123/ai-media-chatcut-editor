<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI自媒体剪辑配色</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#202733;font:16px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1100px;margin:auto;padding:36px 22px}h1{font-size:30px;margin:0 0 10px}p{margin:8px 0 22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}.scheme{border:3px solid transparent;border-radius:18px;padding:22px;cursor:pointer;position:relative;min-height:222px;text-align:left;font:inherit;box-shadow:0 4px 15px #0000000a}.scheme[aria-pressed=true]{outline:3px solid #3b82f6;outline-offset:3px}.name{font-size:19px;font-weight:750}.demo{font-size:27px;font-weight:800;line-height:1.3;margin:20px 0 10px}.line{font-size:14px}.swatches{display:flex;gap:9px;margin-top:20px}.swatches span{width:30px;height:30px;border-radius:50%;border:1px solid #8884}.controls{margin-top:28px;background:white;border-radius:16px;padding:22px}textarea{width:100%;min-height:100px;border:1px solid #cfd5df;border-radius:10px;padding:12px;font:inherit}button.action{border:0;border-radius:9px;padding:10px 17px;margin:10px 8px 0 0;background:#17263a;color:white;font:inherit;cursor:pointer}.note{font-size:14px;color:#596475;margin-top:14px}.status{min-height:25px;color:#14663d}</style>
<main><h1>先选喜欢的色系</h1><p>可以多选。选完把下方文字发给剪辑助手，再确定一个主色方案；已有品牌色也可以直接告诉助手。</p><div class="grid" id="schemes"></div><section class="controls"><b>发给剪辑助手</b><textarea id="choice" readonly aria-label="已选配色"></textarea><button class="action" id="copy">复制选择</button><button class="action" id="save">保存偏好JSON</button><div class="status" id="status" aria-live="polite"></div><p class="note">这里只设置颜色，不固定视频画幅。严格参考模式与个人主题色冲突时，由你决定保留参考色或替换为个人色。页面离线可用，不会上传素材或账号信息。</p></section></main>
<script>const palettes=[{"id": "P1", "name": "电光蓝紫", "background": "#0B1020", "surface": "#141E35", "text": "#F7FAFC", "secondaryText": "#C6D2E5", "primary": "#4D8DFF", "accent": "#A78BFA", "textOnPrimary": "#081122"}, {"id": "P2", "name": "青绿青柠", "background": "#071915", "surface": "#102A24", "text": "#F5FBF7", "secondaryText": "#BAD9CC", "primary": "#37D5B0", "accent": "#D4F86A", "textOnPrimary": "#08221A"}, {"id": "P3", "name": "奶油珊瑚", "background": "#F5F1E8", "surface": "#FFFFFF", "text": "#1D2725", "secondaryText": "#52615A", "primary": "#B93824", "accent": "#20785B", "textOnPrimary": "#FFFFFF"}, {"id": "P4", "name": "暖白琥珀", "background": "#FFFAED", "surface": "#FFFFFF", "text": "#26211A", "secondaryText": "#6D6255", "primary": "#9A5700", "accent": "#F2C94C", "textOnPrimary": "#FFFFFF"}, {"id": "P5", "name": "淡紫莓色", "background": "#F6F1FF", "surface": "#FFFFFF", "text": "#282033", "secondaryText": "#675C75", "primary": "#7142B8", "accent": "#9F3B75", "textOnPrimary": "#FFFFFF"}, {"id": "P6", "name": "黑白朱红", "background": "#FAFAF8", "surface": "#FFFFFF", "text": "#181818", "secondaryText": "#626262", "primary": "#B52F27", "accent": "#181818", "textOnPrimary": "#FFFFFF"}];const picked=new Set();const root=document.getElementById('schemes');function update(){const a=palettes.filter(p=>picked.has(p.id));document.getElementById('choice').value=a.length?'我喜欢这些色系：'+a.map(p=>p.id+' '+p.name).join('、')+'。请从中推荐一个主方案，并按我的视频内容搭配辅助色。':'请选择喜欢的色系，也可以直接让助手推荐。';}for(const p of palettes){const b=document.createElement('button');b.className='scheme';b.type='button';b.style.background=p.background;b.style.color=p.text;b.setAttribute('aria-pressed','false');b.innerHTML='<div class="name">'+p.id+' · '+p.name+'</div><div class="demo">把 AI 用进<br><span style="color:'+p.primary+'">真实创作</span></div><div class="line" style="color:'+p.secondaryText+'">工具演示 / 作品展示 / 清楚的步骤</div><div class="swatches">'+[p.primary,p.accent,p.text,p.surface].map(c=>'<span title="'+c+'" style="background:'+c+'"></span>').join('')+'</div>';b.onclick=()=>{picked.has(p.id)?picked.delete(p.id):picked.add(p.id);b.setAttribute('aria-pressed',picked.has(p.id)?'true':'false');update();};root.appendChild(b);}document.getElementById('copy').onclick=async()=>{const a=document.getElementById('choice');try{await navigator.clipboard.writeText(a.value);document.getElementById('status').textContent='已复制';}catch(e){a.focus();a.select();document.getElementById('status').textContent='请使用系统复制快捷键复制已选中的文字';}};document.getElementById('save').onclick=()=>{const blob=new Blob([JSON.stringify({schema:1,likedPaletteIds:[...picked],chosenPaletteId:null},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='color-preferences.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};update();</script></html>
